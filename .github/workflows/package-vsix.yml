name: Package VSIX

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packaged VSIX files to VS Code Marketplace
        type: boolean
        default: true
  push:
    branches:
      - release

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            also_target: darwin-x64
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Linux X11 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev

      - name: Build macOS helper
        if: runner.os == 'macOS'
        run: ./native/macos/build.sh

      - name: Build Windows helper
        if: runner.os == 'Windows'
        shell: cmd
        run: native\windows\build.bat

      - name: Build Linux helper
        if: runner.os == 'Linux'
        run: ./native/linux-x11/build.sh

      - name: Package primary target
        run: node scripts/package-target.mjs ${{ matrix.target }}

      - name: Package extra Darwin target
        if: ${{ matrix.also_target }}
        run: node scripts/package-target.mjs ${{ matrix.also_target }}

      - name: Upload VSIX artifacts
        uses: actions/upload-artifact@v6
        with:
          name: vscode-smart-zoom-${{ matrix.target }}
          path: |
            *.vsix
          if-no-files-found: error

  publish:
    name: Marketplace
    needs: package
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: vscode-smart-zoom-*
          merge-multiple: true
          path: vsix

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish platform VSIX files
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "Missing secret VSCE_PAT. Add an Azure DevOps Marketplace Manage PAT in repo Actions secrets."
            exit 1
          fi
          shopt -s nullglob
          files=(vsix/*.vsix)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .vsix files found under vsix/"
            ls -la vsix || true
            exit 1
          fi
          echo "Publishing ${#files[@]} VSIX file(s):"
          printf ' - %s\n' "${files[@]}"
          for f in "${files[@]}"; do
            echo "::group::Publish $(basename "$f")"
            vsce publish --packagePath "$f"
            echo "::endgroup::"
          done
